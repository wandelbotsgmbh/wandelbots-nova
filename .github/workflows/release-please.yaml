---
name: "@wandelbots/wandelbots-nova: Release please"

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # Creates / updates the release PR on every push to main. When that PR is
  # merged, it publishes the GitHub release + tag and sets release_created=true.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate token for pipeline-version-bumper app
        id: app-token
        uses: tibdex/github-app-token@v2.1.0
        with:
          app_id: ${{ secrets.PIPELINE_VERSION_BUMPER_APPID }}
          private_key: ${{ secrets.PIPELINE_VERSION_BUMPER_SECRET }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Use the app token so the release PR / tag come from the app actor
          # and so downstream workflows (CI) are triggered on the release PR.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only once the release PR is merged and a release/tag was created.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel & sdist
        run: |
          python -m pip install --upgrade uv
          uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Upload wheel to GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/*.whl --clobber
