---
name: "SAST: uv-audit"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: "33 4 * * 1" # weekly

permissions:
  contents: read

jobs:
  uv-audit:
    runs-on: ubuntu-latest
    env:
      # requires-python is open-ended (>=3.12); without a pin uv picks the newest CPython,
      # for which binary-only deps such as pyarrow may not have wheels yet.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --extra "nova-rerun-bridge" --extra "wandelscript" --extra "novax"

      # LeRobot 0.6.1 caps torch <2.12 and setuptools <82. The fixes are in
      # torch 2.13 (GHSA-rrmf-rvhw-rf47) and setuptools 83 and 84.1, so these
      # stay ignored until LeRobot lifts its caps. Remove them then.
      - name: Audit dependencies (experimental with uv audit)
        run: |
          uv audit --preview-features audit-command \
            --ignore GHSA-rrmf-rvhw-rf47 \
            --ignore PYSEC-2026-3447 \
            --ignore GHSA-xmj3-9gf7-h52w
