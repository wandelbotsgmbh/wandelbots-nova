---
name: "SAST: Dependency review"

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # LeRobot 0.6.1 caps torch <2.12 and setuptools <82. The fixes are in
      # torch 2.13 (GHSA-rrmf-rvhw-rf47) and setuptools 83 and 84.1, so these
      # stay ignored until LeRobot lifts its caps. Remove them then.
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          allow-ghsas: "GHSA-rrmf-rvhw-rf47,GHSA-h35f-9h28-mq5c,GHSA-xmj3-9gf7-h52w"
