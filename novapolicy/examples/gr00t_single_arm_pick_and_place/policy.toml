# Deployment config of the GR00T cube pick-and-place policy on ur10e-calibration.
# Every value is declared; nothing is fitted at run time. Check it with:
#   uv run python -m novapolicy.gr00t.inspect_policy --config <this file> --data <folder>
# Format: novapolicy/gr00t/policy_config.py.

[server]
host = "172.31.11.129"
port = 30555

# --- Facts of the trained policy (checkpoint-14000, IsaacLab UR10ePlaceCubeEnvCfg) -------
[policy]
prompt = "pick up the cube and place it on the yellow square"
language_key = "annotation.human.task_description"
rate_hz = 30.0                    # sim dt 1/120 s, decimation 4
action_horizon = 16
state_keys = ["arm_joints", "gripper"]
action_keys = ["eef_delta", "gripper"]
video_keys = ["wrist", "side", "top"]
image_width = 320                 # the sim cameras' resolution (4:3)
image_height = 240

[policy.joints]
key = "arm_joints"
unit = "rad"

[policy.tcp_action]
key = "eef_delta"
# DifferentialIK relative pose command: [dx, dy, dz] + rotation vector, applied each step to
# the measured TCP pose, rotation pre-multiplied, in the robot base frame (= NOVA base).
representation = "delta"
frame = "base"
base_rotation_z_deg = 0.0
position_unit = "m"
rotation_format = "rotvec"
# The sim tracked each command for 4 substeps: realized motion per step / commanded.
gain_position = 0.24
gain_rotation = 0.30

[policy.gripper]
state_key = "gripper"
action_key = "gripper"
action = "binary"                 # BinaryJointPositionAction
close_when = "negative"
state_open = 0.0                  # UMI finger joint: 0.0 open, -0.023 closed
state_closed = -0.023
state_holding = -0.0136           # fingers on the cube

# --- The cell ---------------------------------------------------------------------------
[cell]
controller = "ur10e-calibration"
tcp = "umi_corrected"             # finger-pad midpoint, the sim's IK point
home_deg = [90.0, -90.0, 90.0, -90.0, -90.0, 0.0]
camera_server = "http://172.31.11.253/cell/realsense"
gripper_host = "172.31.13.49"     # Turck TBEN-S2-4IOL for the Zimmer GEH6060IL
gripper_open_gap_mm = 80.0        # Zimmer GEH6060IL jaw gap after homing

[cell.cameras]
wrist = "427622271414"            # D405 on the flange
side = "319522063360"             # D415, angled view across the table
top = "314522065367"              # D415, bird's-eye view

# --- Safety limits: the deployer's choice ---------------------------------------------------
[guards]
max_tcp_speed_mm_s = 650.0
max_chunk_travel_mm = 250.0
max_rotation_step_deg = 5.0
max_tilt_deg = 23.0
max_yaw_deg = 30.0
workspace_x_mm = [-460.0, 275.0]
workspace_y_mm = [-800.0, -240.0]
min_tcp_z_mm = 25.0               # the table (safety plane) is z = 0
