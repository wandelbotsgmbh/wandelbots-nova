# Metadata for the novapolicy extra package.
# This is NOT an independently installable package — it ships as part of
# wandelbots-nova and is activated via extras such as:
#   pip install wandelbots-nova[novapolicy]
#   pip install wandelbots-nova[novapolicy-gr00t]
#   pip install wandelbots-nova[novapolicy-lerobot]
#
# Dependencies are declared in the root pyproject.toml under
# [project.optional-dependencies].

[project]
name = "nova-policy"
version = "0.1.0-alpha"
description = "EXPERIMENTAL: waypoint-jogging-based policy execution for NOVA robots"
requires-python = ">=3.11, <3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ============================================================
# RUFF CONFIGURATION - MAXIMUM STRICTNESS
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
fix = true
show-fixes = true
preview = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except (no bare except:)
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "T20",    # flake8-print (no print statements)
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "Q",      # flake8-quotes
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint (includes PLR1702: too-many-nested-blocks)
    "PERF",   # perflint (performance)
    "ANN",    # flake8-annotations (require type hints)
    "ARG",    # flake8-unused-arguments
    "FBT",    # flake8-boolean-trap (no boolean positional args)
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
]

ignore = [
    "line-too-long",    # Line too long (formatter handles this)
    "assert",    # Allow assert (tests might import from here)
    "too-many-arguments", # Too many arguments
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"gr00t/__init__.py" = ["non-empty-init-module"]
"rerun/__init__.py" = ["non-empty-init-module"]
"rerun/action_chunk.py" = ["import-outside-top-level"]
"rerun/logger.py" = ["import-outside-top-level"]
"**/tests/**" = [
    "assert", "hardcoded-password-string", "suspicious-pickle-import", "magic-value-comparison", "too-many-positional-arguments", "too-many-nested-blocks", "no-self-use",
    "ANN", "FBT", "T20", "import-outside-top-level", "import-private-name", "manual-list-comprehension",
    "collapsible-if", "needless-bool", "if-with-same-arms", "typing-only-first-party-import", "typing-only-standard-library-import", "ARG", "useless-expression", "class-as-data-structure",
    "async-function-with-timeout", "async-busy-wait", "blocking-sleep-in-async-function", "unused-async", "float-equality-comparison", "pytest-fixture-autouse",
]
"**/examples/**" = [
    "assert", "hardcoded-password-string", "try-except-pass", "magic-value-comparison", "too-many-branches", "too-many-locals", "too-many-statements",
    "global-variable-not-assigned", "global-statement", "ANN", "FBT", "T20",
    "import-outside-top-level", "manual-list-comprehension", "collapsible-if", "needless-bool", "if-with-same-arms",
    "typing-only-first-party-import", "typing-only-standard-library-import", "ARG", "ambiguous-unicode-character-comment", "unused-async", "float-equality-comparison",
    "blind-except", "function-call-in-default-argument", "zip-without-explicit-strict", "complex-structure",
]
"**/benchmarks/**" = [
    "assert", "hardcoded-password-string", "try-except-pass", "magic-value-comparison", "too-many-branches", "too-many-locals", "too-many-statements",
    "global-variable-not-assigned", "global-statement", "ANN", "FBT", "T20",
    "import-outside-top-level", "manual-list-comprehension", "collapsible-if", "needless-bool", "if-with-same-arms",
    "typing-only-first-party-import", "typing-only-standard-library-import", "ARG", "ambiguous-unicode-character-comment", "unused-async", "float-equality-comparison",
    "blind-except", "function-call-in-default-argument", "zip-without-explicit-strict", "complex-structure",
]

[tool.ruff.lint.isort]
known-first-party = ["nova", "novapolicy"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================
# BASEDPYRIGHT CONFIGURATION
# ============================================================
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnknownMemberType = true
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportIncompatibleMethodOverride = true
reportPrivateUsage = true
reportConstantRedefinition = true
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportUnusedImport = "error"
reportDuplicateImport = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportImplicitOverride = true
reportShadowedImports = true
reportDeprecated = "warning"
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]
venvPath = "."
venv = ".venv"

# ============================================================
# PYTEST CONFIGURATION
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
markers = [
    "integration: marks tests as integration tests",
]
